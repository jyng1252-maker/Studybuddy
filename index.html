<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<meta name="description" content="StudyBuddy - Plan you study, track your progress.">
<title>StudyBuddy | Study Planner</title>

<style>
:root{--primary: #6c63ff;--primary-dark: #5148d8;--background: #f5f5fb;--surface: #ffffff;--text: #292943;--muted: #77778d;--border: #e8e7f2;--danger: #bb3030;--success: #21845b;}
*{box-sizing: border-box;}
body{margin: 0;font-family: Arial, Helvetica, sans-serif;background: var(--background);color: var(--text);line-height: 1.5;)
button, input, select{font: inherit;}
button{cursor: pointer;border: none;border-radius: 9px;padding: 10px 14px;font-weight: 600;transition: opacity 0.2s, transform 0.2s;}
button:hover{opacity; 0.88;}
button:active{transform: scale(0.98);}
button:focus-visible,input:focus-visible,select:focus-visible{outline: 3px solid #aaa5ff;outline-offset: 2px;}
header{background: linear-gradient(135deg, #6c63ff, #938bff);color: white;text-align: center;padding: 35px 2-px;}
header h1{font-size: clamp(28px,5vw,42px);margin: 0 0 8px;}
header p{margin: 4px 0;}
.container{max-width: 900px;margin: 28px auto;padding: 0 16px;}
.panel{background: var(--surface);padding: 22px;border-radius: 16px;margin-bottom: 22px;box-shadow: 0 4px 18px rgba(41, 41, 67, 0.05);}
.panel h2{margin-top: 0;font-size: 21px;}
.form-grid{display: grid;grid-template-columns: repeat(2, minmax(0, 1fr));gap: 16px;}
.field{min-width: 0;}
.full-width{grid-column:1/-1;}
label{display: block;font-weight: 600;font-size: 14px;margin-bottom: 7px;}
input:not([type="checkbox"]),
select{width: 100%;padding: 12px;border: 1px solid #dcdbea;border-radius: 9px;background: white;color: var(--text);}
.primary{background: var(--primary);color: white;}
.secondary{background: #eeedff;color: var(--primary-dark);}
.danger{background: #ffeded;color: var(--danger);}
.success{background: #e5f7ed;color: #18794e;}
.stats{display:grid-template-columns: repeat(3, minmax(0, 1fr));gap: 12px;margin-bottom: 20px}
.stat-card{background: #f7f6ff;border-radius: 12px;padding: 16px 10px;text-align: center;}
.stat-number{display: block;font-size: 27px;font-weight: bold;color: var(--primary-dark);}
.stat-label{color: var(--muted);font-size: 13px;}
.progress-track{width: 100%;height: 12px;background: #e9e8f5;border-radius: 30px;overflow: hidden;margin-top: 12px;}
.progress-bar{height: 100%;width: 0;background: linear-gradient(90deg, #6c63ff, #938bff);border-radius: 30px;transition: width 0.3s ease;}
.toolbar{display: flex;justify-content: space-between;align-items: center;gap: 12px;flex-wrap: wrap;margin-bottom: 16px}
.toolbar h2{margin: 0;}
.toolbar select{width: auto;max-width: 100%;}
.task-list{display: grid;gap: 12px;}
.task{display: flex;align-items: flex-start;gap: 12px;border: 1px solid var(--border);border-radius: 12px;padding: 16px;min-width: 0;}
.task-checkbox{width: 19px;height: 19px;margin-top: 4px;flex-shrink: 0;accent-color: var(--primary);cursor: pointer;}
.task-info{flex: 1;min-width: 0;}
.task-info h3{margin: 0 0 8px;font-size: 17px;overflow-wrap: anywhere;}
.task-info p {color: var(--muted);margin: 5px 0;font-size： 14px;overflow-wrap: anywhere;}
.task.completed h3 {text-decoration: line-through;color: #89899b;}
.task.completed {background: #fcfcff;}
.priority {display: inline-block;padding: 4px 9px;border-radius: 20px;background: #eeedff;color: var(--primary-dark);font-size: 12px;font-weight: 600;margin-top: 4px;}
.priority.High {background: #ffeded;color: var(--danger);}
.priority.Medium {background: #fff4d9;color: #8a5c00;}
.priority.Low {background: #e5f7ed;color: #18794e;}
.task-actions {display: flex;gap: 7px;flex-wrap: wrap;margin-top: 12px;}
.task-actions button {padding: 8px 11px;font-size: 12px;}
.empty {text-align: center;color: var(--muted);padding: 28px 10px;border: 1px dashed var(--border); border-radius: 12px;}
.message {min-height: 22px;margin: 10px 0 0;color: var(--primary-dark);font-size: 14px;}
.hint {color: var(--muted);font-size: 13px;margin: 10px 0 0;}
footer {text-align: center;color: var(--muted);padding: 22px 16px;font-size: 13px;}
[hidden] {display: none !important;}
 @media (max-width: 560px) {header {padding: 28px 16px;}
.container {margin-top: 18px;padding: 0 12px;}
.panel {padding: 17px; border-radius: 13px;}
 .form-grid { grid-template-columns: 1fr;}
.full-width {grid-column: auto;}
.stats {gap: 7px;}
.stat-card {padding: 12px 5px;}
.stat-number {font-size: 23px;}
.stat-label {font-size: 11px;}
.toolbar {align-items: stretch;}
.toolbar select {width: 100%;}
.task {padding: 12px;}}
 .search-container {
  margin: 12px 0 18px;
}

#searchInput {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 14px;
  box-sizing: border-box;
}

#searchInput:focus {
  outline: 2px solid #93c5fd;
  border-color: #3b82f6;
}
  </style>
</head>

<body>
  <header>
    <h1>📚 StudyBuddy</h1>
    <p>Plan your study. Track your progress.</p>
    <p>规划学习，记录进步。</p>
  </header>

  <main class="container">

    <!-- Add / Edit Task -->
    <section class="panel">
      <h2 id="formTitle">➕ Add a Study Task / 添加学习任务</h2>

      <form id="taskForm">
        <div class="form-grid">

          <div class="field full-width">
            <label for="taskTitle">Task Name / 任务名称</label>
            <input
              id="taskTitle"
              type="text"
              maxlength="120"
              placeholder="e.g. Revise Economics Chapter 2"
              required
            >
          </div>

          <div class="field">
            <label for="subject">Subject / 科目</label>
            <select id="subject">
              <option>Critical Thinking</option>
              <option>Mathematics</option>
              <option>Financial Accounting</option>
              <option>Principle of Economics</option>
              <option>English</option>
              <option>Programming</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="dueDate">Due Date / 截止日期</label>
            <input id="dueDate" type="date" required>
          </div>

          <div class="field full-width">
            <label for="priority">Priority / 优先级</label>
            <select id="priority">
              <option value="Low">Low / 低</option>
              <option value="Medium" selected>Medium / 中</option>
              <option value="High">High / 高</option>
            </select>
          </div>

          <div class="field full-width">
            <button class="primary" type="submit" id="submitBtn">
              Add Task / 添加任务
            </button>

            <button
              class="secondary"
              type="button"
              id="cancelEdit"
              hidden
            >
              Cancel / 取消
            </button>

            <p id="message" class="message" role="status" aria-live="polite"></p>
          </div>

        </div>
      </form>
    </section>

    <!-- Progress -->
    <section class="panel">
      <h2>📊 My Progress / 我的学习进度</h2>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-number" id="totalCount">0</span>
          <span class="stat-label">Total / 总任务</span>
        </div>

        <div class="stat-card">
          <span class="stat-number" id="pendingCount">0</span>
          <span class="stat-label">Pending / 未完成</span>
        </div>

        <div class="stat-card">
          <span class="stat-number" id="completedCount">0</span>
          <span class="stat-label">Completed / 已完成</span>
        </div>
      </div>

      <p id="progressText">0% completed / 已完成 0%</p>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Task completion progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressTrack"
      >
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <!-- Task List -->
    <section class="panel">
      <div class="toolbar">
        <h2>📝 My Tasks / 我的任务</h2>

       <div class="search-container">
  <input
    type="search"
    id="searchInput"
    placeholder="Search tasks... / 搜索任务..."
    aria-label="Search tasks"
  >
</div>

<div id="taskList"></div>

        <select id="filter" aria-label="Filter tasks">
          <option value="all">All Tasks / 全部任务</option>
          <option value="active">Pending / 未完成</option>
          <option value="completed">Completed / 已完成</option>
        </select>
      </div>

      <div id="taskList" class="task-list"></div>
    </section>

  </main>

  <footer>
    StudyBuddy © 2026 | Keep learning, keep growing.
    <br>
    持续学习，持续进步。
  </footer>

  <script>
    "use strict";

    const STORAGE_KEY = "studybuddy_tasks_v2";

    const form = document.getElementById("taskForm");
    const titleInput = document.getElementById("taskTitle");
    const subjectInput = document.getElementById("subject");
    const dueInput = document.getElementById("dueDate");
    const priorityInput = document.getElementById("priority");
    const taskList = document.getElementById("taskList");
    const filterInput = document.getElementById("filter");
    const message = document.getElementById("message");

    let tasks = [];
    let editingId = null;

    // Load tasks from browser storage / 从浏览器读取任务
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const parsed = saved ? JSON.parse(saved) : [];

      if (Array.isArray(parsed)) {
        tasks = parsed.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.subject === "string" &&
          typeof task.dueDate === "string" &&
          ["Low", "Medium", "High"].includes(task.priority) &&
          typeof task.completed === "boolean"
        );
      }
    } catch (error) {
      console.error("Could not load saved tasks:", error);
    }

    // Save tasks / 保存任务
    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (error) {
        console.error("Could not save tasks:", error);
        showMessage("Unable to save data. Please check browser storage.");
        return false;
      }
    }

    function showMessage(text) {
      message.textContent = text;
    }

    // Escape text before displaying user input / 安全显示用户输入
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderTasks() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const pending = total - completed;
      const percent = total
        ? Math.round(completed / total * 100)
        : 0;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("completedCount").textContent = completed;

      document.getElementById("progressText").textContent =
        `${percent}% completed / 已完成 ${percent}%`;

      document.getElementById("progressBar").style.width =
        `${percent}%`;

      document.getElementById("progressTrack").setAttribute(
        "aria-valuenow",
        percent
      );

      const filter = filterInput.value;
const searchInput = document.getElementById("searchInput");
const searchTerm = searchInput.value.trim().toLowerCase();

const visibleTasks = tasks.filter(task => {
  // Step 1: Apply the existing status filter
  // 第一步：保留原本的任务状态筛选
  if (filter === "active" && task.completed) return false;
  if (filter === "completed" && !task.completed) return false;

  // Step 2: Apply the search filter
  // 第二步：加入关键词搜索
  const title = (task.title || "").toLowerCase();
  const subject = (task.subject || "").toLowerCase();

  return title.includes(searchTerm) ||
         subject.includes(searchTerm);
});

      if (visibleTasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty">
            <p>No tasks found.</p>
            <p>没有找到任务。试着添加一个新的学习任务吧！</p>
          </div>
        `;
        return;
      }

      taskList.innerHTML = visibleTasks.map(task => `
        <article class="task ${task.completed ? "completed" : ""}">
          <input
            class="task-checkbox"
            type="checkbox"
            aria-label="Mark task as completed"
            data-action="toggle"
            data-id="${escapeHTML(task.id)}"
            ${task.completed ? "checked" : ""}
          >

          <div class="task-info">
            <h3>${escapeHTML(task.title)}</h3>
            <p>📘 ${escapeHTML(task.subject)}</p>
            <p>📅 Due date / 截止日期：${escapeHTML(task.dueDate)}</p>

            <span class="priority ${escapeHTML(task.priority)}">
              ${escapeHTML(task.priority)} Priority / 优先级
            </span>

            <div class="task-actions">
              <button
                type="button"
                class="secondary"
                data-action="edit"
                data-id="${escapeHTML(task.id)}"
              >
                Edit / 编辑
              </button>

              <button
                type="button"
                class="danger"
                data-action="delete"
                data-id="${escapeHTML(task.id)}"
              >
                Delete / 删除
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function resetForm() {
      form.reset();
      editingId = null;

      document.getElementById("formTitle").textContent =
        "➕ Add a Study Task / 添加学习任务";

      document.getElementById("submitBtn").textContent =
        "Add Task / 添加任务";

      document.getElementById("cancelEdit").hidden = true;
    }

    // Add or update task / 新增或更新任务
    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const dueDate = dueInput.value;

      if (!title || !dueDate) {
        showMessage("Please fill in the required fields.");
        return;
      }

      const previousTasks = tasks.map(task => ({ ...task }));

      if (editingId !== null) {
        tasks = tasks.map(task =>
          task.id === editingId
            ? {
                ...task,
                title,
                subject: subjectInput.value,
                dueDate,
                priority: priorityInput.value
              }
            : task
        );
      } else {
        tasks.push({
          id: window.crypto &&
              typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2),
          title,
          subject: subjectInput.value,
          dueDate,
          priority: priorityInput.value,
          completed: false
        });
      }

      if (!saveTasks()) {
        tasks = previousTasks;
        return;
      }

      resetForm();
      renderTasks();

      showMessage("Task saved successfully! 任务保存成功！");
    });

    // Edit and delete actions / 编辑与删除
    taskList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");

      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const task = tasks.find(item => item.id === id);

      if (!task) return;

      if (action === "edit") {
        editingId = id;

        titleInput.value = task.title;
        subjectInput.value = task.subject;
        dueInput.value = task.dueDate;
        priorityInput.value = task.priority;

        document.getElementById("formTitle").textContent =
          "✏️ Edit Study Task / 编辑学习任务";

        document.getElementById("submitBtn").textContent =
          "Save Changes / 保存修改";

        document.getElementById("cancelEdit").hidden = false;

        titleInput.focus();
      }

      if (action === "delete") {
        const confirmed = window.confirm(
          "Delete this task? / 确定删除这个任务吗？"
        );

        if (!confirmed) return;

        const previousTasks = tasks;
        tasks = tasks.filter(item => item.id !== id);

        if (!saveTasks()) {
          tasks = previousTasks;
          renderTasks();
          return;
        }

        if (editingId === id) {
          resetForm();
        }

        renderTasks();
        showMessage("Task deleted. 任务已删除。");
      }
    });

    // Mark task complete / 标记任务完成
    taskList.addEventListener("change", event => {
      const checkbox = event.target.closest(
        'input[data-action="toggle"]'
      );

      if (!checkbox) return;

      const task = tasks.find(
        item => item.id === checkbox.dataset.id
      );

      if (!task) return;

      const previousValue = task.completed;
      task.completed = checkbox.checked;

      if (!saveTasks()) {
        task.completed = previousValue;
        renderTasks();
        return;
      }

      renderTasks();
      showMessage("Progress updated! 学习进度已更新！");
    });

    // Cancel editing / 取消编辑
    document.getElementById("cancelEdit").addEventListener(
      "click",
      () => {
        resetForm();
        showMessage("Editing cancelled. 已取消编辑。");
      }
    );

    // Filter tasks / 筛选任务
    filterInput.addEventListener("change", renderTasks);

    // Initial display / 初始显示
    renderTasks();
   document.getElementById("searchInput").addEventListener("input", () => {
  renderTasks();
});
  </script>
</body>
</html>
