<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy | Study Planner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5fb;
      color: #292943;
    }

    header {
      background: #6c63ff;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    main {
      max-width: 850px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px #2929430c;
    }

    h2 { margin-top: 0; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddddeb;
      border-radius: 8px;
      background: white;
      color: #292943;
    }

    .full { grid-column: 1 / -1; }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #aaa5ff;
      outline-offset: 2px;
    }

    .primary {
      background: #6c63ff;
      color: white;
    }

    .secondary {
      background: #eeedff;
      color: #5148d8;
    }

    .danger {
      background: #ffeded;
      color: #bb3030;
    }

    .progress-track {
      height: 10px;
      background: #e9e8f5;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #6c63ff;
      transition: width .2s;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar select { width: auto; }

    .task {
      border: 1px solid #e8e7f2;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-info h3 {
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .task-info p {
      margin: 5px 0;
      color: #66667d;
      font-size: 14px;
    }

    .task.completed h3 {
      text-decoration: line-through;
      color: #89899b;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .task-actions button { font-size: 12px; }

    .priority {
      display: inline-block;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #eeedff;
      color: #5148d8;
    }

    .priority.High {
      background: #ffeded;
      color: #bb3030;
    }

    .priority.Medium {
      background: #fff4d9;
      color: #8a5c00;
    }

    .empty {
      text-align: center;
      color: #77778d;
      padding: 25px 0;
    }

    #message {
      font-size: 14px;
      color: #5148d8;
      margin: 10px 0 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #77778d;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .task { flex-wrap: wrap; }
      .task-info { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 StudyBuddy</h1>
    <p>Plan your study. Track your progress.</p>
    <p>规划学习，记录进步。</p>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">➕ Add a Study Task</h2>

      <form id="taskForm">
        <div class="form-grid">
          <div class="full">
            <label for="taskTitle">Task Name / 任务名称</label>
            <input id="taskTitle" maxlength="120"
              placeholder="e.g. Revise Economics Chapter 2"
              required>
          </div>

          <div>
            <label for="subject">Subject / 科目</label>
            <select id="subject">
              <option>Critical Thinking</option>
              <option>Mathematics</option>
              <option>Financial Accounting</option>
              <option>Principle of Economics</option>
              <option>English</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label for="dueDate">Due Date / 截止日期</label>
            <input type="date" id="dueDate" required>
          </div>

          <div class="full">
            <label for="priority">Priority / 优先级</label>
            <select id="priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>

          <div class="full">
            <button class="primary" type="submit" id="submitBtn">
              Add Task / 添加任务
            </button>
            <button class="secondary" type="button"
              id="cancelEdit" hidden>
              Cancel / 取消
            </button>
            <p id="message" role="status" aria-live="polite"></p>
          </div>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>📊 My Progress / 我的进度</h2>
      <p id="progressText">0 of 0 tasks completed (0%)</p>
      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0">📝 My Tasks / 我的任务</h2>
        <select id="filter" aria-label="Filter tasks">
          <option value="all">All Tasks / 全部</option>
          <option value="active">Pending / 未完成</option>
          <option value="completed">Completed / 已完成</option>
        </select>
      </div>

      <div id="taskList"></div>
    </section>
  </main>

  <footer>
    StudyBuddy © 2026 | Keep learning, keep growing.
  </footer>

  <script>
    const STORAGE_KEY = "studybuddy_tasks_v2";

    const form = document.getElementById("taskForm");
    const titleInput = document.getElementById("taskTitle");
    const subjectInput = document.getElementById("subject");
    const dueInput = document.getElementById("dueDate");
    const priorityInput = document.getElementById("priority");
    const taskList = document.getElementById("taskList");
    const filterInput = document.getElementById("filter");
    const message = document.getElementById("message");

    let tasks = [];
    let editingId = null;

    // Load saved tasks / 读取已保存的任务
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const parsed = saved ? JSON.parse(saved) : [];

      if (Array.isArray(parsed)) {
        tasks = parsed.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.subject === "string" &&
          typeof task.dueDate === "string" &&
          typeof task.priority === "string" &&
          typeof task.completed === "boolean"
        );
      }
    } catch (error) {
      console.error("Could not load tasks:", error);
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (error) {
        console.error("Could not save tasks:", error);
        message.textContent =
          "Could not save data. Check your browser storage.";
        return false;
      }
    }

    function showMessage(text) {
      message.textContent = text;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderTasks() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const percent = total ? Math.round(completed / total * 100) : 0;

      document.getElementById("progressText").textContent =
        `${completed} of ${total} tasks completed (${percent}%)`;

      document.getElementById("progressBar").style.width =
        `${percent}%`;

      const filter = filterInput.value;
      const visibleTasks = tasks.filter(task => {
        if (filter === "active") return !task.completed;
        if (filter === "completed") return task.completed;
        return true;
      });

      if (!visibleTasks.length) {
        taskList.innerHTML =
          '<p class="empty">No tasks here yet. Add your first task!<br>这里还没有任务，添加你的第一个学习任务吧！</p>';
        return;
      }

      taskList.innerHTML = visibleTasks.map(task => `
        <article class="task ${task.completed ? "completed" : ""}">
          <input
            type="checkbox"
            aria-label="Mark ${escapeHTML(task.title)} as completed"
            data-action="toggle"
            data-id="${escapeHTML(task.id)}"
            ${task.completed ? "checked" : ""}
            style="width:18px;height:18px;margin-top:3px"
          >

          <div class="task-info">
            <h3>${escapeHTML(task.title)}</h3>
            <p>📘 ${escapeHTML(task.subject)}</p>
            <p>📅 Due: ${escapeHTML(task.dueDate)}</p>
            <span class="priority ${escapeHTML(task.priority)}">
              ${escapeHTML(task.priority)} Priority
            </span>

            <div class="task-actions">
              <button class="secondary"
                data-action="edit" data-id="${escapeHTML(task.id)}">
                Edit / 编辑
              </button>
              <button class="danger"
                data-action="delete" data-id="${escapeHTML(task.id)}">
                Delete / 删除
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function resetForm() {
      form.reset();
      editingId = null;
      document.getElementById("formTitle").textContent =
        "➕ Add a Study Task";
      document.getElementById("submitBtn").textContent =
        "Add Task / 添加任务";
      document.getElementById("cancelEdit").hidden = true;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = titleInput.value.trim();
      const dueDate = dueInput.value;

      if (!title || !dueDate) {
        showMessage("Please complete all required fields.");
        return;
      }

      const originalTasks = tasks.map(task => ({...task}));

      if (editingId) {
        tasks = tasks.map(task => task.id === editingId
          ? {
              ...task,
              title,
              subject: subjectInput.value,
              dueDate,
              priority: priorityInput.value
            }
          : task
        );
      } else {
        tasks.push({
          id: crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2),
          title,
          subject: subjectInput.value,
          dueDate,
          priority: priorityInput.value,
          completed: false
        });
      }

      if (!saveTasks()) {
        tasks = originalTasks;
        return;
      }

      resetForm();
      renderTasks();
      showMessage("Task saved successfully! 任务保存成功！");
    });

    taskList.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const task = tasks.find(item => item.id === id);

      if (!task) return;

      if (action === "edit") {
        editingId = id;
        titleInput.value = task.title;
        subjectInput.value = task.subject;
        dueInput.value = task.dueDate;
        priorityInput.value = task.priority;

        document.getElementById("formTitle").textContent =
          "✏️ Edit Study Task / 编辑任务";
        document.getElementById("submitBtn").textContent =
          "Save Changes / 保存修改";
        document.getElementById("cancelEdit").hidden = false;
        titleInput.focus();
      }

      if (action === "delete") {
        if (!confirm("Delete this task? 确定删除这个任务吗？")) return;

        const oldTasks = tasks;
        tasks = tasks.filter(item => item.id !== id);

        if (!saveTasks()) {
          tasks = oldTasks;
          return;
        }

        if (editingId === id) resetForm();
        renderTasks();
        showMessage("Task deleted. 任务已删除。");
      }
    });

    taskList.addEventListener("change", event => {
      const checkbox = event.target.closest('input[data-action="toggle"]');
      if (!checkbox) return;

      const task = tasks.find(item => item.id === checkbox.dataset.id);
      if (!task) return;

      task.completed = checkbox.checked;

      if (!saveTasks()) {
        task.completed = !checkbox.checked;
        checkbox.checked = task.completed;
        return;
      }

      renderTasks();
      showMessage("Progress updated! 进度已更新！");
    });

    document.getElementById("cancelEdit").addEventListener("click", () => {
      resetForm();
      showMessage("Editing cancelled. 已取消编辑。");
    });

    filterInput.addEventListener("change", renderTasks);

    renderTasks();
  </script>
</body>
</html>
